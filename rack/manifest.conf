# What goes where, and how to tell the running program about it.
#
#   name          target                          reload command (- for none)
#
# Sources are relative to RACK_DOTFILES, which defaults to the directory above
# this file. Everything rack does reads from this table, so adding an
# application is adding a line. Whole-line comments only: # is a legitimate
# value character, as every hex colour demonstrates.

hypr            ~/.config/hypr                    hyprctl reload
foot            ~/.config/foot                    -
kitty           ~/.config/kitty                   -
ghostty         ~/.config/ghostty                 -
nvim            ~/.config/nvim                    -
btop            ~/.config/btop                    -
matugen         ~/.config/matugen                 -
zsh             ~/.config/zsh                     -
# Read when WirePlumber starts; the one file in it says how to apply it live.
wireplumber     ~/.config/wireplumber             -

# Single files, named by their path in the repo the way quickshell/main is.
# .zshenv has to reach $HOME, not ~/.config: it is what sets ZDOTDIR, so
# without it zsh never finds the zsh entry above and starts bare. starship
# reads ~/.config/starship.toml, a file rather than a directory of its own.
zshenv/.zshenv          ~/.zshenv                 -
starship/starship.toml  ~/.config/starship.toml   -

# gtk-3.0 and gtk-4.0 were orbit's NESTED_PACKAGES special case: stow strips
# the package directory name, so gtk.css landed at ~/.config/gtk.css. Here the
# target is just written out, and the special case stops existing.
gtk-3.0         ~/.config/gtk-3.0                 -
gtk-4.0         ~/.config/gtk-4.0                 -

# quickshell holds its configs as named siblings, each landing at
# ~/.config/quickshell/<name> so `qs -c main` works. Tested 2026-09-20: a
# slashed name resolves its source correctly and `rack diff` reports it as
# already deployed, which is what the stow invocation it replaces produced.
# `old` was removed from the repo, so only `main` exists to deploy.
#
# No reload command: quickshell watches its own files and reloads within a
# couple of seconds, so a reload here would be a second, slower one. Note that
# an edit which replaces the file's inode (sed -i, most formatters) does not
# trip that watch — `touch` a file it still holds to force it.
quickshell/main   ~/.config/quickshell/main      -

