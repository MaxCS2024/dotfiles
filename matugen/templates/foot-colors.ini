# Generated by matugen — do not edit by hand.
#
# Reuses the same roles as templates/colors.json (red/green/orange pinned,
# primary/outline harmonized) so the terminal palette matches quickshell
# and Hyprland; base16 fills in the hues Material has no native role for
# (magenta/cyan/near-black).
#
# foot.ini includes this file — see the `include=` line there. foot only
# reads config at startup, so already-open terminals keep their old colors
# until restarted; new ones pick this up immediately.
[colors-dark]
foreground={{colors.on_background.default.hex_stripped}}
background={{colors.background.default.hex_stripped}}

regular0={{base16.base00.default.hex_stripped}}
regular1={{colors.red.default.hex_stripped}}
regular2={{colors.green.default.hex_stripped}}
regular3={{colors.orange.default.hex_stripped}}
regular4={{colors.primary.default.hex_stripped}}
regular5={{base16.base0e.default.hex_stripped}}
regular6={{base16.base0c.default.hex_stripped}}
regular7={{base16.base05.default.hex_stripped}}

bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.red.default.hex_stripped}}
bright2={{colors.green.default.hex_stripped}}
bright3={{colors.orange.default.hex_stripped}}
bright4={{colors.primary.default.hex_stripped}}
bright5={{base16.base0e.default.hex_stripped}}
bright6={{base16.base0c.default.hex_stripped}}
bright7={{colors.on_background.default.hex_stripped}}
