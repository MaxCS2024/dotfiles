[main]
include=~/.cache/matugen/foot-colors.ini
include=~/.cache/quickshell/foot-theme.ini
term=xterm-256color
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=12
pad=14x0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

# Two generated color sources, applied in the order they are included
# above — where both set a key, the later one wins:
#
#   ~/.cache/matugen/foot-colors.ini    the wallpaper palette, written by
#     matugen. See matugen/config.toml and templates/foot-colors.ini.
#
#   ~/.cache/quickshell/foot-theme.ini  the named theme picked under
#     Appearance in quickshell's settings, written by
#     quickshell/main/theme/TerminalTheme.qml. Holds nothing but comments
#     while Appearance is set to follow the wallpaper, which is what
#     leaves matugen's colors above standing.
#
# Each is missing until whatever writes it has run once. foot logs a
# "failed to open" error for a missing include but does start, falling
# back to its built-in colors for anything unset. Colors are read at
# startup only: both land in the next terminal opened, not in the ones
# already running.

