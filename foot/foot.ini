[main]
include=~/.cache/quickshell/foot-colors.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
pad=14x0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

# Colours come from ~/.cache/quickshell/foot-colors.ini, included at the
# top of this file: the shell's active palette, wallpaper or preset,
# written by quickshell/main/theme/AppColors.qml — the same palette kitty
# and ghostty get.
#
# The file is missing until the shell has run once. foot logs a "failed
# to open" error for the include but does start, with its built-in
# colors. foot reads colors at startup only, so the shell also sends
# running foots the new palette as escape sequences on their pty; a
# program that resets the colors (OSC 104/110/111) puts back the ones
# that foot started with.

