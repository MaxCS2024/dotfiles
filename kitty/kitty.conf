# Colours come from the shell's active palette, wallpaper or preset,
# written by quickshell/main/theme/AppColors.qml — the same palette foot
# and ghostty get.
#
# The file is missing until the shell has run once; kitty logs "Could not
# find included config file … ignoring" and starts anyway. Unlike foot,
# running kitties pick a change up without a restart: the shell sends
# SIGUSR1 after writing, which makes kitty re-read this file.
include ~/.cache/quickshell/kitty-colors.conf
