# Two generated colour sources, the same pair foot.ini includes and in the
# same order — where both set a key, the later one wins:
#
#   ~/.cache/matugen/kitty-colors.conf    the wallpaper palette, written by
#     matugen. See matugen/config.toml and templates/kitty-colors.conf.
#
#   ~/.cache/quickshell/kitty-theme.conf  the named theme picked under
#     Appearance in quickshell's settings, written by
#     quickshell/main/theme/TerminalTheme.qml. Holds nothing but comments
#     while Appearance follows the wallpaper, which leaves matugen's
#     colours above standing.
#
# Each is missing until whatever writes it has run once; kitty logs
# "Could not find included config file … ignoring" and starts anyway.
# Unlike foot, running kitties pick a change up without a restart: both
# writers send SIGUSR1 after writing, which makes kitty re-read this file.
include ~/.cache/matugen/kitty-colors.conf
include ~/.cache/quickshell/kitty-theme.conf
