# Colours come from the shell's active palette, wallpaper or preset,
# written by quickshell/main/theme/AppColors.qml — the same palette foot
# and ghostty get.
#
# The file is missing until the shell has run once; kitty logs "Could not
# find included config file … ignoring" and starts anyway. Unlike foot,
# running kitties pick a change up without a restart: the shell sends
# SIGUSR1 after writing, which makes kitty re-read this file.
include ~/.cache/quickshell/kitty-colors.conf

# Everything below copies foot.ini, the terminal the others follow, so
# the three look the same. kitty measures in pts at 96 dpi: foot's 12pt
# font is the same size here, and its 14px side padding is 10.5pt.
font_family JetBrainsMono Nerd Font
font_size 12
window_padding_width 0 10.5

# foot renders no ligatures.
disable_ligatures always

scrollback_lines 10000
wheel_scroll_multiplier 7.0

# A steady block in reverse video, as foot draws it. Shell integration
# would turn it into a bar at the prompt; no-cursor keeps the block.
cursor_shape block
cursor_blink_interval 0
cursor none
shell_integration no-cursor

# Selections in reverse video too, foot's default.
selection_foreground none
selection_background none
