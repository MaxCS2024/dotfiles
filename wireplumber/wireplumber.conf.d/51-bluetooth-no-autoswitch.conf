# Bluetooth headsets stay in music mode (A2DP) when something starts
# recording. WirePlumber's default switches them to headset mode (HFP) so
# their microphone can be used, and headset mode carries that microphone over
# a SCO link, which this machine's Intel adapter (8087:0a2b) cannot do: on
# 2026-09-24 voxtype started recording with a Nothing Ear (3) connected, the
# kernel logged a flood of "hci0: corrupted SCO packet" and the machine froze
# in the same second.
#
# So recording uses the laptop's microphone. A call that wants the earbuds'
# microphone has to pick the headset profile by hand (pavucontrol, or
# `wpctl set-profile`), and doing so risks the same freeze.
#
# Read when WirePlumber starts. To apply it without a restart:
#   wpctl settings bluetooth.autoswitch-to-headset-profile false
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
