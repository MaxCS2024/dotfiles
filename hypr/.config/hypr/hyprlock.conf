general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Or touch the fingerprint reader
        present_message = Reading fingerprint...
    }
}

$qs_bar = rgb(2e3440)
$qs_fgStrong = rgb(d8dee9)
$qs_fgSoft = rgb(bcc1cb)
$qs_fgMuted = rgb(d8dee9)
$qs_separator = rgb(434c5e)
$qs_border = rgb(4c566a)
$qs_accent = rgb(88c0d0)
$qs_red = rgb(bf616a)
source = ~/.cache/quickshell/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

background {
    monitor =
    path = ~/.cache/quickshell/lock-wallpaper
    color = $qs_bar
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:60000] set -- Söndag Måndag Tisdag Onsdag Torsdag Fredag Lördag; shift "$(date +%w)"; day=$1; set -- Januari Februari Mars April Maj Juni Juli Augusti September Oktober November December; shift "$(( $(date +%-m) - 1 ))"; echo "$day, $(date +%-d) $1"
    color = $qs_fgMuted
    font_family = $font
    font_size = 11
    position = 0, 106
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_features='tnum' letter_spacing='-1300'>$TIME</span>
    color = $qs_fgStrong
    font_family = $font
    font_size = 64
    position = 0, 41
    halign = center
    valign = center
}

shape {
    monitor =
    size = 150, 1
    color = $qs_separator
    rounding = 0
    border_size = 0
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $qs_fgSoft
    font_family = $font
    font_size = 12
    position = 0, -34
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 230, 30
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(00000000)
    font_color = $qs_fgStrong
    font_family = $font
    check_color = $qs_accent
    fail_color = $qs_red
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = false
    fade_on_empty = false
    placeholder_text =
    fail_text = $PAMFAIL
    hide_input = false
    position = -10, -98
    halign = center
    valign = center
}

shape {
    monitor =
    size = 230, 1
    color = $qs_border
    rounding = 0
    border_size = 0
    position = -10, -113
    halign = center
    valign = center
}

label {
    monitor =
    text = →
    color = $qs_fgMuted
    font_family = $font
    font_size = 13
    position = 120, -98
    halign = center
    valign = center
}
