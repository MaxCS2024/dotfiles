# hypridle — see https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# dpms goes through the Lua dispatcher: with the Lua config, `hyprctl
# dispatch dpms off` is a syntax error. `action` has to be spelled out,
# because a dpms dispatch without one toggles.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300                                 # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                 # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800                                # 30 min
    on-timeout = systemctl suspend
}
