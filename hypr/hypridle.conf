# hypridle — see https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# dpms goes through the Lua dispatcher: with the Lua config, `hyprctl
# dispatch dpms off` is a syntax error. `action` has to be spelled out,
# because a dpms dispatch without one toggles.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# The timers, in seconds; empty means never. These are the defaults: the
# dynamic island's settings window (Power) writes this machine's own in
# hypridle.local.conf, ignored by git, and restarts hypridle. A machine
# without that file logs one "no match" line for the source and keeps
# these.
$lock_after = 300
$screen_off_after = 330
$suspend_after =

# hyprlang noerror true
source = ~/.config/hypr/hypridle.local.conf
# hyprlang noerror false

# hyprlang if lock_after
listener {
    timeout = $lock_after
    on-timeout = loginctl lock-session
}
# hyprlang endif

# hyprlang if screen_off_after
listener {
    timeout = $screen_off_after
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
# hyprlang endif

# hyprlang if suspend_after
listener {
    timeout = $suspend_after
    on-timeout = systemctl suspend
}
# hyprlang endif
