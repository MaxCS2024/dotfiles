# hyprlock — see https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
    no_fade_in = false
}

# Fingerprint and password both unlock, whichever comes first. It goes through
# fprintd's D-Bus API, not PAM, so it needs nothing in /etc/pam.d. On a
# machine with no fprintd, hyprlock logs that it couldn't connect and the
# password works as before.
auth {
    fingerprint {
        enabled = true
        ready_message = Or touch the fingerprint reader
        present_message = Reading fingerprint...
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Empty until the reader is listening, so nothing shows where there's no reader.
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(200, 200, 200, 0.8)
    font_size = 12
    position = 0, -75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 60
    position = 0, 160
    halign = center
    valign = center
}
