# hyprlock — see https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Drawn after quickshell's own lock screen design
# (quickshell/main/lockscreen/LockScreen.qml, a visual preview with no auth
# behind it): a ground (now the wallpaper, see background below), a Swedish
# date, a large HH:MM, a short rule, and a password field that is
# only an underline (the user's name beside it is gone). hyprlock stays the real lock,
# with its PAM and fingerprint auth; only the look came over (2026-09-27).

# disable_loading_bar, grace and no_fade_in used to be here too; hyprlock
# 0.9 dropped all three, and logged each as a config error. Grace is the
# --grace flag now, and nothing passes it, so there is none.
general {
    hide_cursor = true
}

# Fingerprint and password both unlock, whichever comes first. It goes through
# fprintd's D-Bus API, not PAM, so it needs nothing in /etc/pam.d. On a
# machine with no fprintd, hyprlock logs that it couldn't connect and the
# password works as before.
auth {
    fingerprint {
        enabled = true
        ready_message = Or touch the fingerprint reader
        present_message = Reading fingerprint...
    }
}

# The colours are the shell's palette, which quickshell writes to the file
# sourced below whenever it changes (theme/AppColors.qml). These are only
# what shows before quickshell has ever run on this machine.
$qs_bar = rgb(2e3440)
$qs_fgStrong = rgb(d8dee9)
$qs_fgSoft = rgb(bcc1cb)
$qs_fgMuted = rgb(d8dee9)
$qs_separator = rgb(434c5e)
$qs_border = rgb(4c566a)
$qs_accent = rgb(88c0d0)
$qs_red = rgb(bf616a)
source = ~/.cache/quickshell/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

# The wallpaper that was on screen when the session locked, blurred and
# dimmed (user request 2026-09-29; a plain $qs_bar ground until then). The
# path is a link quickshell keeps pointing at the current wallpaper
# (wallpaper/Wallpapers.qml), since hyprlock reads it once at launch and
# can't ask awww. `color` shows when the link doesn't exist yet.
#
# brightness 0.45 is set by the brightest wallpapers in the folder, which
# need that much for the clock and the field to stay readable; the dark
# ones just get darker. Blur and brightness are one shader, so
# blur_passes has to stay above 0 for the dimming to happen at all.
background {
    monitor =
    path = ~/.cache/quickshell/lock-wallpaper
    color = $qs_bar
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.2
}

# The date, with the shell's own Swedish names rather than the locale's:
# the same ones bar/Clock.qml uses, and no sv_SE locale is needed. Plain
# case and spacing since 2026-09-29 (user request): it was widely tracked
# small caps, which JetBrains Mono doesn't have, so they came out faked
# from shrunken capitals. The prompts below lost their italics the same day.
label {
    monitor =
    text = cmd[update:60000] set -- Söndag Måndag Tisdag Onsdag Torsdag Fredag Lördag; shift "$(date +%w)"; day=$1; set -- Januari Februari Mars April Maj Juni Juli Augusti September Oktober November December; shift "$(( $(date +%-m) - 1 ))"; echo "$day, $(date +%-d) $1"
    color = $qs_fgMuted
    font_family = $font
    font_size = 11
    position = 0, 106
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_features='tnum' letter_spacing='-1300'>$TIME</span>
    color = $qs_fgStrong
    font_family = $font
    font_size = 64
    position = 0, 41
    halign = center
    valign = center
}

shape {
    monitor =
    size = 150, 1
    color = $qs_separator
    rounding = 0
    border_size = 0
    position = 0, -10
    halign = center
    valign = center
}

# Where the preview says it is only a preview: the fingerprint prompt, which
# is empty until the reader is listening, so nothing shows without one.
label {
    monitor =
    text = $FPRINTPROMPT
    color = $qs_fgSoft
    font_family = $font
    font_size = 12
    position = 0, -34
    halign = center
    valign = center
}

# The password row: an underlined field and an arrow, centred as a pair.
# The account name sat to the left of the field until 2026-09-29, when it
# went at the user's request; the field and arrow moved 22px left to take
# up the room it left.
input-field {
    monitor =
    size = 230, 30
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(00000000)
    font_color = $qs_fgStrong
    font_family = $font
    check_color = $qs_accent
    fail_color = $qs_red
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = false
    fade_on_empty = false
    placeholder_text =
    fail_text = $PAMFAIL
    hide_input = false
    position = -10, -98
    halign = center
    valign = center
}

shape {
    monitor =
    size = 230, 1
    color = $qs_border
    rounding = 0
    border_size = 0
    position = -10, -113
    halign = center
    valign = center
}

label {
    monitor =
    text = →
    color = $qs_fgMuted
    font_family = $font
    font_size = 13
    position = 120, -98
    halign = center
    valign = center
}
